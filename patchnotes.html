<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion Meta | Patch Notes</title>
<meta name="description" content="Balance changes that move 2v2 Hellgate comps up or down the Albion Online tierlist, patch by patch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="wordmark" href="index.html">Albion<span>Meta</span></a>
    <nav class="site-nav">
      <a href="index.html">Builds</a>
      <a href="matchups.html">Matchups</a>
      <a href="patchnotes.html" aria-current="page">Patch notes</a>
      <a href="about.html">About</a>
    </nav>

    <!-- patch and date, edit these two lines every update -->
    <div class="head-meta">
      <span class="head-patch">Radiant Wilds</span>
      <span class="head-updated">2v2 Hellgates &middot; Updated 13 September 2026</span>
      <a class="head-link" href="https://forum.albiononline.com/index.php/Thread/73808-NDA-Balance-Playtests/?pageNo=1"
         target="_blank" rel="noopener">Live Albion patchnotes</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap patch-wide">

    <section class="intro">
      <h1>Patch notes</h1>
    </section>

    <section>
      <div id="patch-list"></div>
    </section>

  </div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>Albion Meta is a fan site and is not connected to Sandbox Interactive.</p>
    <p>Spotted something wrong, or want a comp added? Say so in <a href="about.html">the contact page</a>.</p>
  </div>
</footer>


<script src="patchnotes.js"></script>
<script>
(function () {
  var list = document.getElementById("patch-list");
  if (!list || !window.ALBION_PATCHES) return;

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var data = window.ALBION_PATCHES;
  /* every card points at Albion's own thread, not at where the text was read from */
  var FORUM = "https://forum.albiononline.com/index.php/Thread/73808-NDA-Balance-Playtests/?pageNo=1";

  function changeList(rows) {
    return rows.map(function (e) {
      return '<div class="pn-entry">' +
        "<b>" + esc(e.what) + "</b>" +
        (e.why ? '<p class="patch-why">' + esc(e.why) + "</p>" : "") +
        (e.changes.length
          ? "<ul>" + e.changes.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul>"
          : "") +
      "</div>";
    }).join("");
  }

  list.innerHTML = (data.patches || []).map(function (p, pi) {
    var chips = (p.weapons || []).map(function (w, wi) {
      return '<button type="button" class="pn-weapon" data-patch="' + pi + '" data-weapon="' + wi + '">' +
               '<img src="icons/' + esc(w.icon) + '.png" alt="" loading="lazy" onerror="this.hidden = true">' +
               "<span>" + esc(w.name) + "</span>" +
             "</button>";
    }).join("");

    var rest = (p.other || []).length
      ? '<details class="pn-rest"><summary>Everything else in this patch, ' + p.other.length + ' change' +
        (p.other.length === 1 ? "" : "s") + "</summary>" + changeList(p.other) + "</details>"
      : "";

    return '<article class="card">' +
      '<p class="date">' + esc(p.date) + "</p>" +
      "<h3>" + esc(p.title) + "</h3>" +
      (chips ? '<div class="pn-weapons">' + chips + "</div>" : "") +
      '<div class="pn-detail" id="pn-detail-' + pi + '" hidden></div>' +
      rest +
      '<p class="patch-source"><a href="' + FORUM + '" target="_blank" rel="noopener">The full changelog</a></p>' +
    "</article>";
  }).join("") || '<p class="mu-empty">No combat changes collected yet.</p>';

  /* click a weapon to read what changed for it */
  list.addEventListener("click", function (e) {
    var chip = e.target.closest(".pn-weapon");
    if (!chip) return;
    var pi = +chip.getAttribute("data-patch");
    var wi = +chip.getAttribute("data-weapon");
    var weapon = data.patches[pi].weapons[wi];
    var panel = document.getElementById("pn-detail-" + pi);
    var already = chip.classList.contains("is-open");

    chip.closest(".card").querySelectorAll(".pn-weapon").forEach(function (c) {
      c.classList.remove("is-open");
    });
    if (already) { panel.hidden = true; return; }

    chip.classList.add("is-open");
    panel.innerHTML = "<h4>" + esc(weapon.name) + "</h4>" + changeList(weapon.entries);
    panel.hidden = false;
  });
})();
</script>
</body>
</html>
