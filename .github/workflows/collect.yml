name: Collect 2v2 kill data

# Every 15 minutes. The Albion API only keeps about the last half hour of
# kills, so the gap has to stay well under that or fights are lost for good.
# GitHub can run a scheduled job late when it is busy, hence 15 and not 20.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so you can also run it by hand from the Actions tab

permissions:
  contents: write           # it commits the fresh counts back

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the kill feed
        run: python3 collect-winrates.py

      - name: Commit the new counts
        run: |
          git config user.name  "albion-meta-collector"
          git config user.email "collector@users.noreply.github.com"
          git add kills.json winrates.js
          git diff --staged --quiet || git commit -m "Kill data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
