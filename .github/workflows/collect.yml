name: Collect 2v2 kill data

# Every 15 minutes. The Albion API only keeps about the last half hour of
# kills, so the gap has to stay well under that or fights are lost for good.
# GitHub can run a scheduled job late when it is busy, hence 15 and not 20.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so you can also run it by hand from the Actions tab

permissions:
  contents: write           # it commits the fresh counts back

# Two collectors running at once cannot have their tallies merged afterwards,
# so a run waits for the one before it rather than starting alongside it.
concurrency:
  group: collect-kill-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub delivers a */15 schedule late and unevenly: measured over
      # thirteen runs the gaps were 12 to 23 minutes, averaging 17. The API
      # only holds about thirty minutes of kills, so a long gap loses fights
      # for good and the site's numbers visibly stall.
      #
      # So one trigger collects three times, five minutes apart, and banks
      # each pass as it goes. Banking every pass rather than once at the end
      # matters: the site reads winrates.js through /api/winrates, so a commit
      # is what readers actually see, and holding all three back would leave
      # the numbers twenty minutes old however often the feed was read.
      #
      # Repeating is safe, the script skips event ids it has already banked.
      - name: Read the kill feed and bank each pass
        run: |
          # Whether this run is allowed to rebuild the site is decided once,
          # from the time the run started, so three commits cannot spend three
          # builds. Only the first pass can carry it. One build per ninety
          # minute window and none on a 31st caps it at 16 * 30 = 480 a month,
          # against Cloudflare's free 500, leaving 20 for your own pushes.
          MINUTES=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          DAY=$(( 10#$(date -u +%d) ))
          if [ $(( MINUTES % 90 )) -lt 15 ] && [ "$DAY" -le 30 ]; then
            MAY_BUILD=1
            echo "this run may rebuild the site"
          else
            MAY_BUILD=0
          fi

          git config user.name  "albion-meta-collector"
          git config user.email "collector@users.noreply.github.com"

          for pass in 1 2 3; do
            echo "--- pass $pass of 3, $(date -u '+%H:%M:%S') UTC ---"
            python3 collect-winrates.py

            git add kills.json winrates.js
            if git diff --staged --quiet; then
              echo "nothing new to record"
            else
              # [CI Skip] keeps Cloudflare Pages from building on a data commit.
              if [ "$pass" = "1" ] && [ "$MAY_BUILD" = "1" ]; then SKIP=""; else SKIP=" [CI Skip]"; fi
              git commit -m "Kill data $(date -u '+%Y-%m-%d %H:%M') UTC$SKIP"

              # Someone pushing while this runs would otherwise have the push
              # rejected and the collection thrown away, so put our counts on
              # top of whatever landed and try again.
              #
              # NOT with a rebase. kills.json is one json document, and
              # "git pull --rebase -X ours" merges it line by line: on
              # 2026-09-22 that spliced the "lost" line out of one pending
              # battle, which is a shape the script cannot write, and every run
              # for the next two days died on it. So the two data files are
              # carried across whole. They are the only thing in this commit,
              # and the concurrency group means no other collector is writing
              # them, so nothing is lost by preferring ours outright.
              pushed=0
              for attempt in 1 2 3 4 5; do
                if git push; then pushed=1; echo "pushed on attempt $attempt"; break; fi
                echo "push rejected, replaying our counts on top of origin"
                cp kills.json winrates.js "$RUNNER_TEMP/"
                git fetch origin main
                git reset --hard origin/main
                cp "$RUNNER_TEMP/kills.json" "$RUNNER_TEMP/winrates.js" .
                git add kills.json winrates.js
                if git diff --staged --quiet; then
                  echo "origin already has these counts, nothing left to push"
                  pushed=1
                  break
                fi
                git commit -m "Kill data $(date -u '+%Y-%m-%d %H:%M') UTC$SKIP"
                sleep $((attempt * 5))
              done
              if [ "$pushed" = "0" ]; then echo "could not push after five tries"; exit 1; fi
            fi

            if [ "$pass" != "3" ]; then sleep 300; fi
          done
