name: Collect 2v2 kill data

# Every 15 minutes. The Albion API only keeps about the last half hour of
# kills, so the gap has to stay well under that or fights are lost for good.
# GitHub can run a scheduled job late when it is busy, hence 15 and not 20.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so you can also run it by hand from the Actions tab

permissions:
  contents: write           # it commits the fresh counts back

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the kill feed
        run: python3 collect-winrates.py

      - name: Commit the new counts
        run: |
          git config user.name  "albion-meta-collector"
          git config user.email "collector@users.noreply.github.com"
          git add kills.json winrates.js
          if git diff --staged --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          # [CI Skip] keeps Cloudflare Pages from building on a data commit.
          # Without it this alone is ~2,880 builds a month against a 500 limit,
          # and the site does not need rebuilding anyway: the numbers are read
          # live from /api/winrates.
          git commit -m "Kill data $(date -u '+%Y-%m-%d %H:%M') UTC [CI Skip]"

          # Someone pushing while this runs would otherwise have the push
          # rejected and the whole collection thrown away, so rebase onto
          # whatever landed and try again. The counts are ours, they are the
          # only thing in this commit.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying"
            git pull --rebase -X ours origin main || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "could not push after five tries"
          exit 1
